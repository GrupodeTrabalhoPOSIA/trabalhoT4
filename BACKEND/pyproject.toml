[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-tech-chat-backend"
version = "0.1.0"
description = "API do chatbot acadêmico da Aurora Tech"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pymupdf>=1.26,<2.0",
    "python-docx>=1.2,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
